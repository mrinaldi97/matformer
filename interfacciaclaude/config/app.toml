# The whole shell is described here. Add a server, page, menu entry or theme without touching code.
default_theme = "classic"
toolbar = ["connect", "send", "stop", "clear", "refresh", "theme"]

# One entry per backend. Laptop -> GPU box, SLURM node, ... (tunnel with `ssh -L` if needed).
server = [
  { name = "gpu-box",       url = "ws://localhost:8765" },
  { name = "slurm-node-12", url = "ws://localhost:8766" },
]

# kind: chat (custom) | table (any backend method returning rows, merged over all servers) | log | stub
pages = [
  { id = "chat",     group = "Work",       title = "Chat / Inference", kind = "chat" },
  { id = "models",   group = "Work",       title = "Models",           kind = "table", call = "models.list",   columns = ["name", "params", "dtype", "path"] },
  { id = "datasets", group = "Work",       title = "Datasets",         kind = "table", call = "datasets.list", columns = ["name", "split", "tokens"] },
  { id = "files",    group = "Work",       title = "Files",            kind = "files", root = "/" },
  { id = "config",   group = "Work",       title = "Config editor",    kind = "config", root = "/configs" },
  { id = "training", group = "Work",       title = "Training",         kind = "stub" },
  { id = "interp",   group = "Understand", title = "Interpretability", kind = "stub" },
  { id = "steering", group = "Understand", title = "Steering lab",     kind = "stub" },
  { id = "saes",     group = "Understand", title = "SAE explorer",     kind = "stub" },
  { id = "circuits", group = "Understand", title = "Circuits",         kind = "stub" },
  { id = "plots",    group = "Measure",    title = "Plots",            kind = "plots" },
  { id = "evals",    group = "Measure",    title = "Evaluations",      kind = "table", call = "evals.list", columns = ["name", "model", "score"] },
  { id = "runs",     group = "Measure",    title = "Experiments",      kind = "stub" },
  { id = "logs",     group = "Measure",    title = "Logs",             kind = "log" },
  { id = "settings", group = "System",     title = "Settings",         kind = "stub" },
]

# items: [label, action, shortcut]  ->  Main.do_<action>.   "-" = separator.
[[menu]]
title = "&File"
items = [["&Connect", "connect", "Ctrl+K"], ["&Open settings…", "load", "Ctrl+O"], ["&Save settings…", "save", "Ctrl+S"], "-", ["E&xit", "quit", "Ctrl+Q"]]
[[menu]]
title = "&Edit"
items = [["C&lear transcript", "clear", "Ctrl+L"]]
[[menu]]
title = "&View"      # dock toggles are appended automatically
items = [["&Refresh page", "refresh", "F5"], ["&Theme", "theme", "Ctrl+T"], "-"]
[[menu]]
title = "&Run"
items = [["&Send prompt", "send", "Ctrl+Return"], ["S&top generation", "stop", "Esc"]]
[[menu]]
title = "&Help"
items = [["&About", "about", "F1"]]

# Any QPalette role name works. Add a table here and Ctrl+T cycles through it.
[themes.classic]
Window = "#d4d0c8"
WindowText = "#000000"
Base = "#ffffff"
AlternateBase = "#f0efe8"
Text = "#000000"
Button = "#d4d0c8"
ButtonText = "#000000"
Highlight = "#0a246a"
HighlightedText = "#ffffff"
ToolTipBase = "#ffffe1"
ToolTipText = "#000000"
[themes.dark]
Window = "#2d2d30"
WindowText = "#e6e6e6"
Base = "#1e1e1e"
AlternateBase = "#252526"
Text = "#e6e6e6"
Button = "#3c3c3f"
ButtonText = "#e6e6e6"
Highlight = "#3a6ea5"
HighlightedText = "#ffffff"
ToolTipBase = "#3c3c3f"
ToolTipText = "#e6e6e6"
