[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matformer"
version = "0.1.0"
description = "A modular transformer library"
authors = [
    {name = "Matteo Rinaldi" },
    {name = "Calogero Jerik Scozzaro"}
]
readme = "readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "torch>=2.6.0",
    "zstandard",
    "lightning>=2.5.0,<3",
    "pytorch-lightning>=2.5.0,<3",
    "wandb",
    "einops>=0.8.1",
    "nltk",
    "orjson",
    "lmdb",
    "transformers",
    "tokenizers",
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
nvidia = ["transformer_engine",
"liger_kernel","flash_attn"]
test = ["pytest"]


[tool.setuptools.packages.find]
where = ["."]
include = ["matformer*"]
