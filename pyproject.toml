[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matformer"
version = "0.1.0"
description = "A modular transformer library"
authors = [
    {name = "Matteo Rinaldi" },
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# Core dependencies discovered from your imports
dependencies = [
    "torch>=2.6.0",
    "zstandard",
    "wandb",
    "einops>=0.8.1",
    "nltk",
    "orjson",
    "lmdb",
    "matplotlib",
    "numpy<2.4.0",
    "omegaconf",
    "rotary_embedding_torch",
    "safetensors",
    "sentencepiece",
    "torchmetrics",
    "tqdm",
    "PyYAML",
    "pytest",
]

[project.optional-dependencies]
duckdb = ["duckdb"]
pandas = ["pandas"]
xlstm = ["xlstm"]
kernels = [
    "flash_attn",
    "liger_kernel",
]
huggingface = [
    "transformers",
    "tokenizers",
    "datasets",
    "huggingface_hub"
]



[tool.setuptools.packages.find]
where = ["."]
include = ["matformer*"]
[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
]
