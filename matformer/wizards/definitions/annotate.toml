id = "annotate"
title = "Annotate a dataset"
description = "Run a task over every row of a file or an MDAT and write the predictions as JSONL or MDAT."
category = "Tasks"
order = 10

[[steps]]
id = "model"
title = "Model"
description = "The job loads its own copy of the model, so it keeps running when the console is closed."
[[steps.fields]]
name = "model"
kind = "path"
label = "Model"
default = ""
required = true
doc = "A Matformer checkpoint, a HuggingFace repo (hf://org/model) or a local model folder."
prefill = "model"
[[steps.fields]]
name = "cfg"
kind = "path"
label = "Config"
doc = "Optional YAML merged into the model's own configuration."
[[steps.fields]]
name = "task"
kind = "choice"
label = "Task"
default = "evaluation"
options = ["evaluation", "generation", "masking"]
required = true
[[steps.fields]]
name = "device"
kind = "choice"
label = "Accelerator"
default = "auto"
options = ["auto", "cuda", "cpu"]

[[steps]]
id = "input"
title = "Input and output"
[[steps.fields]]
name = "input"
kind = "path"
label = "Input"
default = ""
required = true
doc = "A JSONL, CSV or CoNLL file, or an MDAT folder."
[[steps.fields]]
name = "dataset"
kind = "text"
label = "MDAT dataset"
doc = "Dataset inside a multi-dataset container. Leave empty for a standalone dataset."
[[steps.fields]]
name = "column"
kind = "text"
label = "Text column"
default = "text"
[[steps.fields]]
name = "label"
kind = "text"
label = "Label column"
doc = "Optional gold labels, used to score the predictions."
[[steps.fields]]
name = "format"
kind = "choice"
label = "Output format"
default = "jsonl"
options = ["jsonl", "mdat"]
[[steps.fields]]
name = "output"
kind = "path"
label = "Output"
default = ""
doc = "Empty writes <input>.annotated.<format>."
[[steps.fields]]
name = "keys_only"
kind = "bool"
label = "Only keys and predictions"
default = false
doc = "MDAT output without a copy of the original documents."
when = { field = "format", is = "mdat" }
[[steps.fields]]
name = "limit"
kind = "int"
label = "Row limit"
default = 0
doc = "Zero annotates every row."
[[steps.fields]]
name = "batch_size"
kind = "int"
label = "Batch size"
default = 8
[[steps.fields]]
name = "max_new_tokens"
kind = "int"
label = "Max new tokens"
default = 64
when = { field = "task", is = "generation" }
[[steps.fields]]
name = "temperature"
kind = "float"
label = "Temperature"
default = 0.7
when = { field = "task", is = "generation" }
[[steps.fields]]
name = "use_chat_template"
kind = "bool"
label = "Use chat template"
default = false
doc = "Render each row through the model's own chat template before feeding it. Off keeps the row as plain text."
[[steps.fields]]
name = "chat_column"
kind = "text"
label = "Chat column"
default = ""
doc = "Multi-turn rows: a column holding a list of {role, content} dicts. Empty uses the text column."
when = { field = "use_chat_template", is = true }
[[steps.fields]]
name = "role_column"
kind = "text"
label = "Role column"
default = ""
doc = "Single-turn rows: the column naming the speaker. A missing value defaults to 'user'."
when = { field = "use_chat_template", is = true }
[[steps.fields]]
name = "system_prompt"
kind = "text"
label = "System prompt"
default = ""
doc = "Prepended as a system message when the template is applied."
when = { field = "use_chat_template", is = true }
[[steps.fields]]
name = "prompt_prefix"
kind = "text"
label = "Prompt prefix"
default = ""
doc = "Prepending to every row's content, for quick question answering."
when = { field = "use_chat_template", is = true }
[[steps.fields]]
name = "add_generation_prompt"
kind = "bool"
label = "Add generation prompt"
default = true
doc = "End each prompt with the assistant header so the model answers instead of continuing the input."
when = { field = "use_chat_template", is = true }
[[steps.fields]]
name = "store_template_in_input_ids"
kind = "bool"
label = "Fuse template into input ids"
default = false
doc = "On: tokenize the whole rendered string (exact at token boundaries). Off: keep content tokens separate and cached (faster)."

[action]
kind = "annotate"
task = "${task}"
model = "${model}"
cfg = "${cfg}"
device = "${device}"
input = "${input}"
dataset = "${dataset}"
column = "${column}"
label = "${label}"
format = "${format}"
output = "${output}"
keys_only = "${keys_only}"
limit = "${limit}"
batch_size = "${batch_size}"
max_new_tokens = "${max_new_tokens}"
temperature = "${temperature}"
use_chat_template = "${use_chat_template}"
chat_column = "${chat_column}"
role_column = "${role_column}"
system_prompt = "${system_prompt}"
prompt_prefix = "${prompt_prefix}"
add_generation_prompt = "${add_generation_prompt}"
store_template_in_input_ids = "${store_template_in_input_ids}"
