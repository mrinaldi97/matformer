includes:
  - training.yaml
  - data4b.yaml
model:
  type: default
  model_class: "language_model"
  name: "Albertina_gold"
  hidden_size: 768
  num_hidden_layers: 12
  tie_word_embeddings: false
  rms_norm_eps: 1e-6
  max_position_embeddings: 1024
  bias: false
  ffn_factor: 3.0
  vocab_size: 32768
  default_layer:
    normalization: "rmsnorm"
    normalization_position: "pre"
    ffn_activation: "swiglu"
    hooks: {}
    sequence_mixer: "attention"
    sequence_mixer_config:
      attn_impl: "flash"
      sliding_window_size: null
      positional_encoding: ["alibi"]
      num_attention_heads: 12


tokenizer:
    pretrained_name: "mrinaldi/Gettone"
    tokenizer_type: "huggingface" #Type is still not-usable
    bos_token_id: 5
    eos_token_id: 6
    pad_token_id: 0
    mask_token_id: 4

masking:
    masked_substitution_rate: 0.2
    cloze_probability: 1.0
    random_probability: 0.0
    same_probability: 0.0

validation:
  ref_task: test
  every_n_steps: 100

task:
  - type: sandbox_train
    name: test
    ref_saver: default
    sandbox_config: 
          - /home/matteo/Albertone/Matformer/matformer/configs/benchmarks/classification/ironita.yaml
          - /home/matteo/Albertone/Matformer/matformer/configs/benchmarks/classification/hs.yaml
          - /home/matteo/Albertone/Matformer/matformer/configs/benchmarks/classification/itacola.yaml


saver:
  type: jsonl
  filename: "predictions.jsonl"
  mode: "a"

