includes:
  - training.yaml
  - data4b.yaml

model:
  type: default
  model_class: "language_model"
  name: "Albertina_gold"
  hidden_size: 768
  num_hidden_layers: 12
  tie_word_embeddings: false
  rms_norm_eps: 1e-6
  max_position_embeddings: 1024
  bias: false
  ffn_factor: 3.0
  vocab_size: 32768
  default_layer:
    normalization: "rmsnorm"
    normalization_position: "pre"
    ffn_activation: "swiglu"
    hooks: {}
    sequence_mixer: "attention"
    sequence_mixer_config:
      attn_impl: "flash"
      sliding_window_size: null
      positional_encoding: ["rope", "alibi"]
      num_attention_heads: 12
      q_norm: true
      k_norm: true
      num_key_value_heads: 4

tokenizer:
    pretrained_name: "mrinaldi/Gettone"
    tokenizer_type: "huggingface" #Type is still not-usable
    bos_token_id: 5
    eos_token_id: 6
    pad_token_id: 0
    mask_token_id: 4

