includes:
  - data4b.yaml

model:
  type: default
  model_class: "language_model"
  name: "Albertina_gold"
  hidden_size: 768
  num_hidden_layers: 12
  tie_word_embeddings: false
  rms_norm_eps: 1e-6
  max_position_embeddings: 1024
  bias: false
  ffn_factor: 3.0
  vocab_size: 32768
  default_layer:
    sequence_mixer: "kda"
    sequence_mixer_config:
      num_heads: 12
      head_dim: 64
      conv_size: 4
      use_short_conv: true
      conv_bias: false
      allow_neg_eigval: true
      allow_bidirectionalize: false
  custom_layers:
    odd:
      sequence_mixer: "attention"
      sequence_mixer_config:
        sliding_window_size: null
        positional_encoding: ["alibi"]
        num_attention_heads: 12
    0:
      sequence_mixer: "attention"
      sequence_mixer_config:
        sliding_window_size: null
        positional_encoding: ["alibi"]
        num_attention_heads: 12
    every_4_offset_2:
      sequence_mixer: "kda"
      sequence_mixer_config:
        num_heads: 12
        head_dim: 64
        conv_size: 4
        use_short_conv: true
        conv_bias: false
        allow_neg_eigval: true
        allow_bidirectionalize: true
        bidirectional_type: "cnn"
        bidirectional_merge_type: "concat_proj"
        bidirectional_num_heads: 6
        bidirectional_head_dim: 64

tokenizer:
    pretrained_name: "mrinaldi/Gettone"
    tokenizer_type: "huggingface" #Type is still not-usable
    bos_token_id: 5
    eos_token_id: 6
    pad_token_id: 0
    mask_token_id: 4
    
masking:
    masked_substitution_rate: 0.2
    cloze_probability: 1.0
    random_probability: 0.0
    same_probability: 0.0
training:
  learning_signal_selector: "single"
  learning_signals: ["masked"]
  lr_scheduling: true
  optimizer: "muon"
  lr: 5e-4
  final_lr: 2e-5
  hold_steps_fraction: 0
  weight_decay: 0.01
  scheduler: "custom"
  warmup_steps_fraction: 0.05
  save_every_n_steps: 500
  max_epochs: 1
  accumulate_grad_batches: 16
  checkpoint_name: "albertina_gold"
  save_dir: "./checkpoints_NEW/albertina_gold"
  logger: ["tqdm","wandb"]
  project_name: "matformer_tests"
  run_name: "bert_test_run"
  seed: 27
  precision: "bf16-mixed"
  varlen_strategy: "unpadding"
  batch_size: 32

saver:
  type: jsonl
  filename: "predictions.jsonl"
  mode: "a"

