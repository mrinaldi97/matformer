task:
  type: evaluation
  save_batch: true
  save_summary: true
  save_model_config: true
  save_input_ids: true
  name: "test"
  compute_perplexity_by_token: false
  save_argmax: true
  num_classes: 32768
  learning_signal: masked
  use_tokenizer: true

masking:
    masked_substitution_rate: 0.2
    cloze_probability: 1.0
    random_probability: 0.0
    same_probability: 0.0

saver:
  type: jsonl
  filename: prova.jsonl