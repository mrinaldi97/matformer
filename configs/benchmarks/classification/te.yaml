includes:
  - "./shared/base_sequence_classification.yaml"
  - "./shared/data_pair_classification.yaml"

model:
  num_classes: 2

training:
  checkpoint_name: "te"
  save_dir: "./checkpoints/sequence_classification/te"
  run_name: "te"

data:
  - name: train
    data_root: "/home/matteo/Albertone/benchmark-bert/data/TE/train.jsonl"
    label2id:
      "NO": 0
      "SI": 1
  - name: test
    data_root: "/home/matteo/Albertone/benchmark-bert/data/TE/test.jsonl"
    label2id:
      "NO": 0
      "SI": 1

validation:
  ref_task: test

task:
  - type: evaluation
    name: test
    learning_signal: sequence_classification
    num_classes: 2
    compute_confusion_matrix: true
    topk: false
