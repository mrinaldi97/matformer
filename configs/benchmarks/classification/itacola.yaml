includes:
  - "./shared/base_sequence_classification.yaml"
  - "./shared/data_sentence_classification.yaml"

model:
  num_classes: 2

training:
  checkpoint_name: "itacola"
  save_dir: "./checkpoints/sequence_classification/itacola"
  run_name: "itacola"

data:
  - name: train
    data_root: "/home/matteo/Albertone/benchmark-bert/data/ITACOLA/train.jsonl"
    label2id:
      0: 0
      1: 1
  - name: test
    data_root: "/home/matteo/Albertone/benchmark-bert/data/ITACOLA/test.jsonl"
    label2id:
      0: 0
      1: 1

validation:
  ref_task: test

task:
  - type: evaluation
    name: test
    learning_signal: sequence_classification
    num_classes: 2
    compute_confusion_matrix: true
    topk: false
