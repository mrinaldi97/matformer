includes:
  - "./shared/base_token_classification.yaml"
  - "./shared/data_token_classification.yaml"

model:
  num_classes: 7

training:
  checkpoint_name: "ner"
  save_dir: "./checkpoints/token_classification/ner"
  run_name: "ner"

data:
  - name: train
    data_root: "/home/matteo/Albertone/benchmark-bert/data/NER/train.jsonl"
    label2id:
      O: 0
      B-PER: 1
      B-LOC: 2
      B-ORG: 3
      I-PER: 4
      I-ORG: 5
      I-LOC: 6
  - name: test
    data_root: "/home/matteo/Albertone/benchmark-bert/data/NER/test.jsonl"
    label2id:
      O: 0
      B-PER: 1
      B-LOC: 2
      B-ORG: 3
      I-PER: 4
      I-ORG: 5
      I-LOC: 6

validation:
  ref_task: test

task:
  - type: evaluation
    name: test
    learning_signal: token_classification
    num_classes: 7
    compute_confusion_matrix: true
    topk: false
