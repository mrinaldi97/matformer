training_config:
    optimizer: "muon"
    lr_scheduling: true
    lr: 5e-4
    final_lr: 2e-5
    hold_steps_fraction: 0.2
    weight_decay: 0.01
    scheduler: "custom"
    gradient_clip_val: 1.0
    warmup_steps_fraction: 0.05
    accumulate_grad_batches: 16
    seed: 27
    save_every_n_steps: 5000
    max_epochs: 1
    checkpoint_name: "albertino"
    save_dir: "./checkpoints"
    logger: "wandb"
    project_name: "Ablations"
    run_name: "Example"
